{% extends "base.html" %} {% block content %}
<h1>{{ page.title }}</h1>

<p><time>{{ page.date }}</time></p>

{% if page.taxonomies %}
    {% for tag in page.taxonomies.tags %}
        <a href="{{ get_taxonomy_url(kind="tags", name=tag) }}">{{ tag }}</a>
    {% endfor %}
{% endif %}


<div lang="en-GB">{{ page.content | safe }} {% endblock content %}</div>
